name: Build Ksud

on:
  push:
    branches: [ "main", "cl2" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - 'manager/**'
      - 'userspace/ksud/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'manager/**'

jobs:
  # ========== 编译 ksud for aarch64 ==========
  build-ksud-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Rust (aarch64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 下载并解压 Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip android-ndk-r25b-linux.zip -d /opt/
          echo "ANDROID_NDK=/opt/android-ndk-r25b" >> $GITHUB_ENV

      - name: 配置 Cargo 工具链 (linker + ar + CC + AR)
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config << EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          ar = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [env]
          CC_aarch64_linux_android = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          AR_aarch64_linux_android = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          EOF

      - name: 设置环境变量 (CC, AR)
        run: |
          echo "CC_aarch64-linux-android=${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "AR_aarch64-linux-android=${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV

      - name: 编译 ksud (Release, aarch64)
        working-directory: ./userspace/ksud
        run: |
          cargo build --release --target aarch64-linux-android
          # 修改路径：确保输出在 userspace/ksud/bin 下
          mkdir -p bin/aarch64-linux-android/release
          cp target/aarch64-linux-android/release/ksud bin/aarch64-linux-android/release/ksud

      - name: 上传 ksud 构件
        uses: actions/upload-artifact@v4
        with:
          name: ksud-aarch64-linux-android
          path: userspace/ksud/bin/aarch64-linux-android/release/ksud